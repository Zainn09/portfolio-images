name: Capture Lightbox Archive

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a10424-portfolio-images
    paths:
      - '.archive-trigger'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      - run: npx playwright install --with-deps chromium

      - name: Remove broken live captures
        run: rm -f shopify-portfolio/lightbox-jewelry/images/*.jpg

      - name: Capture archived storefront
        run: node scripts/capture-lightbox-archive.mjs

      - name: Commit archive captures
        run: |
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "arena-ai-coding-agent[bot]@users.noreply.github.com"
          git add shopify-portfolio/lightbox-jewelry/images shopify-portfolio/lightbox-jewelry/archive-capture-report.json
          if git diff --cached --quiet; then
            echo "No archive images to commit"
          else
            git commit -m "Add archived Lightbox storefront captures"
            git push origin HEAD:${{ github.ref_name }}
          fi
