name: Generate Sprint 11 QA Assets

# Sprint 11 covers project IDs 95-99. Opening or reopening the pull request
# captures the four reachable storefronts and documents Vintage Art Garage (98)
# as publicly unavailable. Re-runs restore finished projects from their
# checkpoints, so they are safe and quick.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: write
  pull-requests: write

# Serialise runs for a branch so two captures never push over each other.
concurrency:
  group: sprint-11-assets-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  capture-package-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the session branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install capture dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium and media tools
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Prepare per-website commits
        run: |
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "arena-ai-coding-agent[bot]@users.noreply.github.com"

      - name: Capture and validate Sprint 11 websites
        env:
          CHECKPOINT_COMMITS: "1"
          CHECKPOINT_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -o pipefail
          node scripts/generate-sprint11-assets.mjs 2>&1 | tee capture-sprint11.log

      - name: Publish capture failure details
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          {
            echo '### Sprint 11 website capture requires attention'
            echo
            echo '```text'
            tail -n 200 capture-sprint11.log 2>/dev/null || echo 'No capture log was produced.'
            echo '```'
          } > /tmp/sprint11-capture-comment.md
          gh pr comment "$PR_URL" --body-file /tmp/sprint11-capture-comment.md

      - name: Build Sprint 11 ZIP
        run: |
          set -o pipefail
          python3 scripts/package_sprint11_assets.py 2>&1 | tee package-sprint11.log

      - name: Verify images and playable MP4 videos
        run: |
          set -o pipefail
          python3 scripts/verify_sprint11_assets.py 2>&1 | tee verify-sprint11.log

      - name: Mark Sprint 11 complete in README
        run: |
          python3 scripts/update_readme_sprint11.py --final
          python3 scripts/build_asset_browser_manifest.py

      - name: Verify Sprint 11 browser and downloads
        run: |
          python3 serve-assets.py --port 4173 > /tmp/sprint11-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:4173/asset-browser/ > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/asset-browser/manifest.json > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/QA-Portfolio-Sprint-11-Assets.zip > /dev/null
          for project in 95-prime-baby-gear 96-ollie-burwell 97-nokoluxe 99-paw-by-four; do
            curl --fail --silent --show-error "http://127.0.0.1:4173/download/project/${project}" -o "/tmp/${project}.zip"
            unzip -t "/tmp/${project}.zip"
          done

      - name: Commit verified Sprint 11 package
        if: success() && github.event_name == 'pull_request'
        run: |
          git add README.md capture-progress-sprint-11.json QA-PORTFOLIO-ASSETS/Sprint-11 QA-Portfolio-Sprint-11-Assets.zip asset-browser/manifest.json asset-browser/manifest-sprint-11.json capture-report-sprint-11.json package-lock.json
          git commit -m "Publish verified Sprint 11 package [skip ci]"
          git fetch origin ${{ github.head_ref }}
          git rebase FETCH_HEAD
          git push origin HEAD:${{ github.head_ref }}

      - name: Upload completed Sprint 11 package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: QA-Portfolio-Sprint-11-Complete
          path: |
            QA-PORTFOLIO-ASSETS/Sprint-11/
            QA-Portfolio-Sprint-11-Assets.zip
            asset-browser/
            capture-report-sprint-11.json
          compression-level: 0
          retention-days: 14

      - name: Publish final QA failure details
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          {
            echo '### Sprint 11 final QA requires attention'
            for log in package-sprint11.log verify-sprint11.log; do
              if [ -s "$log" ]; then
                echo
                echo "#### $log"
                echo '```text'
                tail -n 200 "$log"
                echo '```'
              fi
            done
          } > /tmp/sprint11-final-comment.md
          gh pr comment "$PR_URL" --body-file /tmp/sprint11-final-comment.md

      - name: Upload partial diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sprint-11-capture-diagnostics
          path: |
            QA-PORTFOLIO-ASSETS/Sprint-11/
            capture-progress-sprint-11.json
            capture-report-sprint-11.json
          if-no-files-found: ignore
          retention-days: 3
